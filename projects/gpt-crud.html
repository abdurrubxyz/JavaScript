<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gpt CRUD Task Manager</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-body-tertiary">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <h1 class="text-center mb-4">Task Manager</h1>

          <!-- Form Section -->

          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <h4 class="mb-3">Add New Task</h4>

              <form id="taskForm">
                <div class="mb-3">
                  <label for="title" class="form-label"> Task Title </label>

                  <input
                    type="text"
                    class="form-control"
                    id="title"
                    placeholder="Enter task title"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="description" class="form-label">
                    Description
                  </label>

                  <textarea
                    class="form-control"
                    id="description"
                    rows="3"
                    placeholder="Enter task description"
                    required
                  ></textarea>
                </div>

                <div class="form-check mb-3">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="completed"
                  />

                  <label class="form-check-label" for="completed">
                    Completed
                  </label>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                  Add Task
                </button>

                <button
                  type="button"
                  class="btn btn-secondary"
                  id="cancelBtn"
                  hidden
                >
                  Cancel Edit
                </button>
              </form>
            </div>
          </div>

          <!-- Tasks Section -->

          <h3 class="mb-3">My Tasks</h3>

          <div id="tasksContainer"></div>

          <div id="message" role="status"></div>
        </div>
      </div>
    </div>

    <!-- JavaScript -->

    <script>
      // MockAPI URL

      const API_URL =
        "https://6af4643755a1de7dcf03f5d8.mockapi.io/app/v1/tasks";

      // Selecting HTML elements

      const taskForm = document.getElementById("taskForm");

      const titleInput = document.getElementById("title");

      const descriptionInput = document.getElementById("description");

      const completedInput = document.getElementById("completed");

      const submitBtn = document.getElementById("submitBtn");

      const cancelBtn = document.getElementById("cancelBtn");

      const tasksContainer = document.getElementById("tasksContainer");

      const message = document.getElementById("message");

      // Global variables

      let tasks = [];

      let editingId = null;

      // Display messages

      function showMessage(text, type) {
        message.className = `alert alert-${type} mt-3`;

        message.textContent = text;
      }

      // Check API response

      function checkResponse(response) {
        if (!response.ok) {
          throw new Error("API Error: " + response.status);
        }

        return response;
      }

      // Escape HTML content

      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, (character) => {
          const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          };

          return entities[character];
        });
      }

      // ====================================
      // GET - READ ALL TASKS
      // ====================================

      function getTasks(showLoading = true) {
        if (showLoading) {
          showMessage("Loading tasks...", "info");
        }

        fetch(API_URL)
          .then(checkResponse)

          .then((response) => {
            return response.json();
          })

          .then((data) => {
            tasks = data;

            displayTasks();

            if (showLoading) {
              message.textContent = "";

              message.className = "";
            }
          })

          .catch((error) => {
            showMessage(error.message, "danger");

            console.log(error);
          });
      }

      // ====================================
      // DISPLAY TASKS
      // ====================================

      function displayTasks() {
        tasksContainer.innerHTML = "";

        // Check empty tasks

        if (tasks.length === 0) {
          tasksContainer.innerHTML = `

                    <div class="alert alert-light border">

                        No tasks found. Add your first task!

                    </div>

                `;

          return;
        }

        // Loop through tasks

        tasks.forEach((task) => {
          const taskElement = document.createElement("div");

          taskElement.className = "card shadow-sm mb-3";

          const safeTitle = escapeHTML(task.title || "");

          const safeDescription = escapeHTML(task.description || "");

          const safeId = escapeHTML(task.id);

          taskElement.innerHTML = `

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-start">

                            <div>

                                <h5 class="card-title">

                                    ${safeTitle}

                                </h5>

                                <p class="card-text text-secondary">

                                    ${safeDescription}

                                </p>

                            </div>


                            <span class="badge ${task.completed ? "text-bg-success" : "text-bg-warning"}">

                                ${task.completed ? "Completed" : "Pending"}

                            </span>

                        </div>


                        <button

                            class="btn btn-sm btn-warning mt-2"

                            data-action="edit"

                            data-id="${safeId}"

                        >

                            Edit

                        </button>


                        <button

                            class="btn btn-sm btn-danger mt-2"

                            data-action="delete"

                            data-id="${safeId}"

                        >

                            Delete

                        </button>

                    </div>

                `;

          tasksContainer.appendChild(taskElement);
        });
      }

      // ====================================
      // POST - CREATE NEW TASK
      // ====================================

      function addTask(taskData) {
        fetch(API_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(taskData),
        })
          .then(checkResponse)

          .then((response) => {
            return response.json();
          })

          .then((data) => {
            console.log("Task Added:", data);

            resetForm();

            showMessage("Task added successfully!", "success");

            getTasks(false);
          })

          .catch((error) => {
            showMessage(error.message, "danger");

            console.log(error);
          });
      }

      // ====================================
      // PUT - UPDATE EXISTING TASK
      // ====================================

      function updateTask(id, taskData) {
        fetch(`${API_URL}/${encodeURIComponent(id)}`, {
          method: "PUT",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(taskData),
        })
          .then(checkResponse)

          .then((response) => {
            return response.json();
          })

          .then((data) => {
            console.log("Task Updated:", data);

            resetForm();

            showMessage("Task updated successfully!", "success");

            getTasks(false);
          })

          .catch((error) => {
            showMessage(error.message, "danger");

            console.log(error);
          });
      }

      // ====================================
      // DELETE - REMOVE TASK
      // ====================================

      function deleteTask(id) {
        fetch(`${API_URL}/${encodeURIComponent(id)}`, {
          method: "DELETE",
        })
          .then(checkResponse)

          .then(() => {
            console.log("Task Deleted:", id);

            showMessage("Task deleted successfully!", "success");

            getTasks(false);
          })

          .catch((error) => {
            showMessage(error.message, "danger");

            console.log(error);
          });
      }

      // ====================================
      // FORM SUBMIT - POST OR PUT
      // ====================================

      taskForm.addEventListener("submit", (event) => {
        event.preventDefault();

        // Get form values

        const taskData = {
          title: titleInput.value.trim(),

          description: descriptionInput.value.trim(),

          completed: completedInput.checked,
        };

        // Check POST or PUT

        if (editingId === null) {
          // POST

          addTask(taskData);
        } else {
          // PUT

          updateTask(editingId, taskData);
        }
      });

      // ====================================
      // EDIT AND DELETE BUTTONS
      // ====================================

      tasksContainer.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");

        if (!button || !tasksContainer.contains(button)) {
          return;
        }

        const id = button.dataset.id;

        // EDIT TASK

        if (button.dataset.action === "edit") {
          // Find selected task

          const selectedTask = tasks.find((task) => {
            return String(task.id) === id;
          });

          if (!selectedTask) return;

          // Store selected task ID

          editingId = id;

          // Fill existing values in form

          titleInput.value = selectedTask.title;

          descriptionInput.value = selectedTask.description;

          completedInput.checked = selectedTask.completed;

          // Change button text

          submitBtn.textContent = "Update Task";

          cancelBtn.hidden = false;

          // Scroll to form

          taskForm.scrollIntoView({
            behavior: "smooth",

            block: "center",
          });
        }

        // DELETE TASK

        if (button.dataset.action === "delete") {
          const confirmDelete = confirm(
            "Are you sure you want to delete this task?",
          );

          if (confirmDelete) {
            deleteTask(id);
          }
        }
      });

      // ====================================
      // RESET FORM
      // ====================================

      function resetForm() {
        taskForm.reset();

        editingId = null;

        submitBtn.textContent = "Add Task";

        cancelBtn.hidden = true;
      }

      // ====================================
      // CANCEL EDIT
      // ====================================

      cancelBtn.addEventListener("click", () => {
        resetForm();
      });

      // ====================================
      // LOAD TASKS WHEN PAGE OPENS
      // ====================================

      getTasks();
    </script>
  </body>
</html>
