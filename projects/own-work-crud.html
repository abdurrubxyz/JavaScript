<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Own work CRUD Task Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container m-5">
      <h1 class="fw-bold text-center">Task Manager</h1>
      <div>
        <h5 class="fw-medium text-center">Add new tasks</h5>
        <div>
          <form action="" id="taskForm">
            <div class="mb-2">
              <label for="title" class="form-label fw-bold">Task Title</label>
              <input
                type="text"
                class="form-control"
                id="title"
                placeholder="Enter task title"
                required
              />
            </div>
            <div class="mb-2">
              <label for="description" class="form-label fw-bold"
                >Description</label
              >
              <textarea
                class="form-control"
                id="description"
                placeholder="Enter task description"
                required
              ></textarea>
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" class="form-check-input" id="completed" />
              <label class="form-check-label fw-medium" for="completed">
                Completed
              </label>
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">
              Add Task
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              id="cancelBtn"
              hidden
            >
              Cancel Edit
            </button>
          </form>
        </div>
      </div>
      <div class="mt-5">
        <h3 class="mb-3">My Tasks</h3>
        <div id="tasksContainer"></div>
        <div id="message" role="status"></div>
      </div>
    </div>
  </body>
</html>
