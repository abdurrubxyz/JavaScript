<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let obj = [];

      function createPost(data) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (data) {
              obj.push(data);
              resolve();
            } else {
              reject("Failed to create post!");
            }
          }, 3000);
        });
      }

      function getPost() {
        setTimeout(() => {
          let output = "";

          obj.forEach((e) => {
            output += `
      <li>${e.id}</li>
      <li>${e.name}</li>
      <li>${e.age}</li>
      `;
          });

          document.body.innerHTML = output;
        }, 1000);
      }

      createPost({
        id: 1,
        name: "abdurrub",
        age: 21,
      })
        .then(() => {
          getPost();
        })
        .catch((error) => {
          console.log(error);
        });
    </script>
  </body>
</html>
