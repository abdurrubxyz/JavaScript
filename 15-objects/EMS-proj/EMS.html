
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="./EMS.css">
</head>
<body>

    <header>
        <h1>Employee Management System</h1>
        <p>Manage your employees easily</p>
    </header>

    <main class="container">

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <p id="employeeCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>
        </section>

        <!-- Add Employee Form -->
        <section class="form-section">

            <h2>Add New Employee</h2>

            <form id="employeeForm">

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="firstName" required>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="lastName" required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" min="18" required>
                </div>

                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="text" name="employeeId" required>
                </div>

                <div class="form-group">
                    <label>Job Role</label>
                    <input type="text" name="jobRole" required>
                </div>

                <div class="form-group">
                    <label>Salary</label>
                    <input type="number" name="salary" min="0" required>
                </div>

                <button type="submit">Add Employee</button>

            </form>

        </section>

        <!-- Employee List -->
        <section class="employees-section">

            <h2>Employee Directory</h2>

            <div id="employeeList" class="employee-grid"></div>

            <p id="emptyMessage" hidden>No employees found.</p>

        </section>

    </main>
 
    <script src="./EMS.js"></script>
</body>
</html>
