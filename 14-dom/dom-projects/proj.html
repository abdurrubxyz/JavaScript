<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      span {
        font-size: 56px;
        display: inline-block;
        margin-bottom: 20px;
      }
      ul {
        font-size: 32px;
      }
      a i {
        margin-left: 50px;
      }
    </style>
  </head>
  <body>
    <section>
      <div class="container">
        <div class="wrapper">
          <span>Task List</span>
          <form action="" id="task-form">
            <label for="task">Enter Your Task :</label>
            <input type="text" id="task" />
            <button type="submit">Add Task</button>
          </form>
          <div>
            <span>Tasks</span>
            <ul class="collection">
              <!-- <li class="collection-item">
                task - 1
                <a href="" class="delete-item secondary-content test">
                    <i class="bi bi-x-lg"></i>
                </a>
              </li> -->
            </ul>
            <button type="submit" id="clear-all">Clear All</button>
          </div>
        </div>
      </div>
    </section>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <script src="./proj.js"></script>
  </body>
</html>
