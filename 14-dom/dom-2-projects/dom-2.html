<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopping Bill Calculator</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">Shopping Bill Calculator</h1>

      <!-- Product Form -->
      <form id="product-form">
        <div class="mb-3">
          <label for="product-name" class="form-label"> Product Name </label>

          <input
            type="text"
            class="form-control"
            id="product-name"
            placeholder="Enter product name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="product-price" class="form-label"> Product Price </label>

          <input
            type="number"
            class="form-control"
            id="product-price"
            placeholder="Enter price"
            min="0.01"
            step="0.01"
            required
          />
        </div>

        <div class="mb-3">
          <label for="product-quantity" class="form-label">
            Product Quantity
          </label>

          <input
            type="number"
            class="form-control"
            id="product-quantity"
            value="1"
            min="1"
            step="1"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Add Product</button>
      </form>

      <hr class="my-4" />

      <!-- Product Table -->
      <h3 class="mb-3">Shopping List</h3>

      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead>
            <tr>
              <th>Product Name</th>
              <th>Price (₹)</th>
              <th>Quantity</th>
              <th>Subtotal (₹)</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="product-list">
            <!-- Products will appear here -->
          </tbody>
        </table>
      </div>

      <!-- Grand Total -->
      <div class="mt-4">
        <h3>Grand Total: ₹ <span id="grand-total">0.00</span></h3>

        <button type="button" id="clear-all" class="btn btn-danger mt-2">
          Clear All
        </button>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="./dom-2.js" defer></script>
  </body>
</html>
